name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  python:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ['3.11', '3.12', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e '.[dev,mcp,workbench]' 'mcp==1.14.0' 'fastapi==0.116.1' 'httpx==0.28.1' 'ruff==0.9.10' 'pytest==8.4.2' 'mypy==2.4.1' 'build==1.3.0'
      - run: python -m pytest -q
      - run: python -m mypy src
      - run: ruff check src tests scripts examples/batch_exceptions.py
      - run: ruff format --check src tests scripts examples/batch_exceptions.py
      - run: python -m build
      - name: Installed wheel smoke
        shell: bash
        run: |
          python -m venv /tmp/intake-wheel
          /tmp/intake-wheel/bin/python -m pip install dist/*.whl
          cd /tmp
          /tmp/intake-wheel/bin/network-intake demo --root intake-demo
          /tmp/intake-wheel/bin/network-intake evaluate --root intake-evaluation
